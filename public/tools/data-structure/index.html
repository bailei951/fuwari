<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>数据结构 · 刷题工具</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f8f9fb;--fg:#1a1a2e;--muted:#8b8b9e;--accent:#6366f1;--accent-light:#eef2ff;
--correct:#22c55e;--correct-bg:#ecfdf5;--wrong:#ef4444;--wrong-bg:#fef2f2;
--card:#fff;--border:#e4e4e7;--radius:12px;--shadow:0 1px 8px rgba(0,0,0,.04);
}
body{font-family:"Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;line-height:1.7}
.app{max-width:960px;margin:0 auto;padding:16px}
.header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.header .title{font-size:1.2rem;font-weight:700;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input{padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--card);color:var(--fg);cursor:pointer;font-family:inherit}
select:focus,button:focus{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{background:transparent;border-color:var(--wrong);color:var(--wrong)}
button.ghost:hover{color:var(--fg);background:var(--accent-light)}
button:active{transform:scale(.96)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.filter-row label{font-size:.8rem;color:var(--muted);white-space:nowrap}
.wrong-toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;user-select:none}
.wrong-toggle input{width:16px;height:16px;cursor:pointer}
.question-type{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:6px;margin-bottom:12px}
.type-tf{background:#fef3c7;color:#d97706}
.type-single{background:#dbeafe;color:#2563eb}
.q-stem{font-size:1.05rem;margin-bottom:20px;line-height:1.8}
.opt-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;margin-bottom:6px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
.opt-item:hover{border-color:var(--accent);background:var(--accent-light)}
.opt-item.selected{border-color:var(--accent);background:var(--accent-light)}
.opt-item.correct{border-color:var(--correct);background:var(--correct-bg)}
.opt-item.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.opt-label{font-weight:700;min-width:24px;color:var(--accent)}
.tf-btns{display:flex;gap:10px}
.tf-btn{flex:1;padding:14px;text-align:center;border:2px solid var(--border);border-radius:8px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all .15s}
.tf-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.tf-btn.selected{border-color:var(--accent);background:var(--accent-light)}
.tf-btn.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.tf-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.result{padding:14px;border-radius:8px;margin-top:16px;font-weight:600;display:none}
.result.show{display:block}
.result.correct{background:var(--correct-bg);color:var(--correct)}
.result.wrong{background:var(--wrong-bg);color:var(--wrong)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.jump-input{width:70px;text-align:center}
.stats{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;background:var(--fg);color:#fff;border-radius:20px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:640px){.header{flex-direction:column;align-items:flex-start}.controls,.filter-row{flex-direction:column;width:100%}select,button,.tf-btn{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="title">📚 数据结构 · 刷题工具</div>
<div class="stats" id="statsLine"></div>
</header>

<div class="card">
<div class="filter-row">
<select id="bankSelect"><option value="all">全部题库</option></select>
<select id="chapterSelect"><option value="all">全部章节</option></select>
<select id="typeSelect"><option value="all">全部题型</option><option value="tf">判断题</option><option value="single">单选题</option></select>
<label class="wrong-toggle"><input type="checkbox" id="wrongToggle"/> 仅错题 (<span id="wrongCount">0</span>)</label>
<span style="flex:1"></span>
<select id="viewSelect"><option value="practice">刷题模式</option><option value="exam">随机考试</option></select>
<div id="examCfg" style="display:none;gap:8px;align-items:center">
<input id="examSize" type="number" value="30" min="5" max="100" style="width:70px"/> 题
<button id="startExam" class="primary">开始</button>
</div>
</div>
</div>

<div class="card" id="questionCard">
<div class="nav-row" style="margin-bottom:16px">
<button id="prevBtn" class="ghost">◀ 上一题</button>
<span id="qIndex" style="font-size:.85rem;color:var(--muted)"></span>
<button id="nextBtn" class="ghost">下一题 ▶</button>
<input id="jumpInput" class="jump-input" type="number" min="1" placeholder="#"/>
<button id="jumpBtn" class="ghost">跳转</button>
<button id="toggleWrongBtn" class="ghost" style="margin-left:auto">☆ 加入错题</button>
</div>
<div id="qTypeTag" class="question-type"></div>
<div id="qStem" class="q-stem"></div>
<div id="optArea"></div>
<div id="tfArea" style="display:none" class="tf-btns"></div>
<div id="resultBox" class="result"></div>
<div class="actions">
<button id="submitBtn" class="primary">提交答案</button>
<button id="showAnswerBtn" class="ghost">显示答案</button>
</div>
</div>

<div id="examCard" class="card" style="display:none">
<h3 style="margin-bottom:12px">📊 考试结果</h3>
<div id="examResult"></div>
<div class="actions" style="margin-top:12px">
<button id="reviewBtn" class="primary">查看详情</button>
<button id="resetExamBtn" class="ghost">退出考试</button>
</div>
</div>
<div id="reviewCard" class="card" style="display:none">
<h3 style="margin-bottom:12px">📋 答题详情</h3>
<div id="reviewList"></div>
</div>
</div>
<div id="toast" class="toast"></div>

document.getElementById('wrongCount').textContent=wrongSet.size;
if(total===0&&(wrongOnly||currentChapter!=='all')){
document.getElementById('qStem').innerHTML='<div class="empty-state"><p style="font-size:2rem;margin-bottom:8px">📭</p><p>没有匹配的题目</p><p style="font-size:.8rem">请调整筛选条件</p></div>';
document.getElementById('optArea').innerHTML='';
document.getElementById('tfArea').style.display='none';
document.getElementById('resultBox').style.display='none';
}
}

function loadQuestion(){
var list=examMode?examQs:getFiltered();
if(list.length===0){updateStats();return;}
if(currentIdx>=list.length)currentIdx=list.length-1;
if(currentIdx<0)currentIdx=0;

var q=list[currentIdx];
document.getElementById('qIndex').textContent=(currentIdx+1)+' / '+list.length;

var tag=document.getElementById('qTypeTag');
tag.textContent=q.type==='tf'?'判断题':'单选题';
tag.className='question-type '+(q.type==='tf'?'type-tf':'type-single');

var stem='<strong>'+q.number+'.</strong> '+q.text;
if(q.chapter) stem+='<br/><small style="color:var(--muted)">['+q.bank+'] '+q.chapter+'</small>';
document.getElementById('qStem').innerHTML=stem;

var isWrong=wrongSet.has(String(q.number));
document.getElementById('toggleWrongBtn').textContent=isWrong?'⭐ 移除错题':'☆ 加入错题';

userAnswer=examMode&&examAnswers.hasOwnProperty(String(currentIdx))?examAnswers[String(currentIdx)]:null;
document.getElementById('resultBox').className='result';
document.getElementById('resultBox').style.display='none';

if(q.type==='tf'){
document.getElementById('optArea').style.display='none';
var tf=document.getElementById('tfArea');
tf.style.display='flex';
tf.innerHTML='<button class="tf-btn'+(userAnswer==='T'?' selected':'')+'" onclick="selTF(\'T\',this)">✅ 正确 (T)</button><button class="tf-btn'+(userAnswer==='F'?' selected':'')+'" onclick="selTF(\'F\',this)">❌ 错误 (F)</button>';
}else{
document.getElementById('tfArea').style.display='none';
var opts=document.getElementById('optArea');
opts.style.display='block';
if(q.options&&q.options.length>0){
opts.innerHTML=q.options.map(function(o){
return '<div class="opt-item'+(userAnswer===o.label?' selected':'')+'" onclick="selOpt(\''+o.label+'\',this)"><span class="opt-label">'+o.label+'.</span><span>'+o.text+'</span></div>';
}).join('');
}else{opts.innerHTML='<p style="color:var(--muted)">无选项数据</p>'}
}

if(userAnswer) showHighlights();
if(typeof MathJax!=='undefined'&&MathJax.typesetPromise) MathJax.typesetPromise([document.getElementById('qStem'),document.getElementById('optArea')]);
updateStats();
}

window.selTF=function(v,el){
document.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('selected')});
el.classList.add('selected');userAnswer=v;
if(examMode) examAnswers[String(currentIdx)]=v;
};
window.selOpt=function(label,el){
document.querySelectorAll('.opt-item').forEach(function(o){o.classList.remove('selected')});
el.classList.add('selected');userAnswer=label;
if(examMode) examAnswers[String(currentIdx)]=label;
};

function showHighlights(){
var list=examMode?examQs:getFiltered();
if(list.length===0||!userAnswer) return;
var q=list[currentIdx];
if(q.type==='tf'){
document.querySelectorAll('.tf-btn').forEach(function(b){
if(b.textContent.includes(q.answer)) b.classList.add('correct');
if(b.textContent.includes(userAnswer)&&userAnswer!==q.answer) b.classList.add('wrong');
});
}else{
document.querySelectorAll('.opt-item').forEach(function(el){
var lbl=el.querySelector('.opt-label').textContent.replace('.','');
if(lbl===q.answer) el.classList.add('correct');
if(lbl===userAnswer&&userAnswer!==q.answer) el.classList.add('wrong');
});
}
}

function submitAnswer(){
var list=examMode?examQs:getFiltered();
if(list.length===0) return;
var q=list[currentIdx];
if(!userAnswer){showToast('请先选择答案');return;}
var correct=(userAnswer===q.answer);
var result=document.getElementById('resultBox');
result.className='result show '+(correct?'correct':'wrong');
result.textContent=correct?'✅ 回答正确！':'❌ 回答错误，正确答案是：'+q.answer;
result.style.display='block';
showHighlights();
if(!correct) wrongSet.add(String(q.number)); else wrongSet.delete(String(q.number));
saveWrong();
var isWrong=wrongSet.has(String(q.number));
document.getElementById('toggleWrongBtn').textContent=isWrong?'⭐ 移除错题':'☆ 加入错题';
updateStats();
if(wrongOnly&&correct) setTimeout(function(){nextQ()},800);
}

function showAnswer(){
var list=examMode?examQs:getFiltered();
if(list.length===0) return;
var q=list[currentIdx];
document.getElementById('resultBox').className='result show';
document.getElementById('resultBox').textContent='正确答案：'+q.answer;
document.getElementById('resultBox').style.display='block';
if(!userAnswer) userAnswer='';
showHighlights();
}

function nextQ(){var list=examMode?examQs:getFiltered();if(currentIdx<list.length-1){currentIdx++;loadQuestion()}else showToast('已是最后一题')}
function prevQ(){if(currentIdx>0){currentIdx--;loadQuestion()}else showToast('已是第一题')}

function startExam(){
var list=getFiltered();
if(list.length===0){showToast('没有题目');return}
var size=Math.min(parseInt(document.getElementById('examSize').value)||30,list.length);
var indices=[];while(indices.length<size){var r=Math.floor(Math.random()*list.length);if(indices.indexOf(r)===-1)indices.push(r)}
indices.sort(function(a,b){return a-b});
examQs=indices.map(function(i){return list[i]});examAnswers={};examMode=true;currentIdx=0;
document.getElementById('questionCard').style.display='block';
document.getElementById('examCard').style.display='none';
document.getElementById('reviewCard').style.display='none';
loadQuestion();showToast('考试开始，共 '+size+' 题');
}
function submitExam(){
if(!examMode) return;
var correct=0,total=examQs.length;
for(var i=0;i<total;i++){if(examAnswers[String(i)]===examQs[i].answer)correct++}
var score=Math.round(correct/total*100),emoji=score>=90?'🎉':score>=60?'👍':'💪';
document.getElementById('examCard').style.display='block';
document.getElementById('examResult').innerHTML='<p style="font-size:2.5rem;font-weight:700;color:var(--accent);margin:8px 0">'+emoji+' '+score+' 分</p><p class="stats">共 <strong>'+total+'</strong> 题，答对 <strong style="color:var(--correct)">'+correct+'</strong> 题，答错 <strong style="color:var(--wrong)">'+(total-correct)+'</strong> 题</p>';
}
function reviewExam(){
var html='';for(var i=0;i<examQs.length;i++){
var q=examQs[i],ans=examAnswers[String(i)]||'未答',ok=ans===q.answer;
html+='<div style="padding:8px 12px;margin-bottom:8px;border-radius:8px;background:'+(ok?'var(--correct-bg)':'var(--wrong-bg)')+'"><strong>#'+(i+1)+'</strong> '+q.text.substring(0,80)+'... <span style="color:'+(ok?'var(--correct)':'var(--wrong)')+'">你的:'+ans+' | 正确:'+q.answer+'</span></div>';
}
document.getElementById('reviewList').innerHTML=html;document.getElementById('reviewCard').style.display='block';
}
function resetExam(){examMode=false;examQs=[];examAnswers={};currentIdx=0;
document.getElementById('examCfg').style.display='none';document.getElementById('examCard').style.display='none';
document.getElementById('reviewCard').style.display='none';document.getElementById('questionCard').style.display='block';
document.getElementById('viewSelect').value='practice';loadQuestion()}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

document.getElementById('submitBtn').onclick=function(){if(examMode){submitAnswer();if(currentIdx>=examQs.length-1)submitExam()}else submitAnswer()};
document.getElementById('showAnswerBtn').onclick=showAnswer;
document.getElementById('prevBtn').onclick=prevQ;
document.getElementById('nextBtn').onclick=nextQ;
document.getElementById('jumpBtn').onclick=function(){var list=examMode?examQs:getFiltered();var n=parseInt(document.getElementById('jumpInput').value);if(n>=1&&n<=list.length){currentIdx=n-1;loadQuestion()}else showToast('无效')};
document.getElementById('jumpInput').onkeydown=function(e){if(e.key==='Enter')document.getElementById('jumpBtn').click()};
document.getElementById('toggleWrongBtn').onclick=function(){var list=examMode?examQs:getFiltered();if(list.length===0)return;var q=list[currentIdx];if(wrongSet.has(String(q.number))){wrongSet.delete(String(q.number));showToast('已移出错题集')}else{wrongSet.add(String(q.number));showToast('已加入错题集')}saveWrong();loadQuestion()};
document.getElementById('wrongToggle').onchange=function(){wrongOnly=this.checked;currentIdx=0;loadQuestion()};

document.getElementById('bankSelect').onchange=function(){currentBank=this.value;currentChapter='all';updateChapters();currentIdx=0;examMode=false;loadQuestion()};
document.getElementById('chapterSelect').onchange=function(){currentChapter=this.value;currentIdx=0;examMode=false;loadQuestion()};
document.getElementById('typeSelect').onchange=function(){currentType=this.value;currentIdx=0;examMode=false;loadQuestion()};
document.getElementById('viewSelect').onchange=function(){
if(this.value==='exam'){document.getElementById('examCfg').style.display='flex'}else{resetExam()}
};
document.getElementById('startExam').onclick=startExam;
document.getElementById('resetExamBtn').onclick=resetExam;
document.getElementById('reviewBtn').onclick=reviewExam;

document.onkeydown=function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')prevQ();if(e.key==='ArrowRight')nextQ();if(e.key==='Enter')submitAnswer()};

updateChapters();loadQuestion();
})();
</script>
</body>
</html>
